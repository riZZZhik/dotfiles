setup-terminal:
  title: Terminal
  description: Zsh, CLI tools, Git helpers, networking and monitoring

  brew:
    - atuin                       # Searchable shell history             — https://atuin.sh
    - fzf                         # Fuzzy text finder                    — https://github.com/junegunn/fzf
    - sheldon                     # Shell plugin manager                 — https://sheldon.cli.rs
    - starship                    # Customizable shell prompt            — https://starship.rs
    - zsh                         #                                        https://zsh.org
    - zoxide                      # Smarter directory jumping            — https://github.com/ajeetdsouza/zoxide
    - asitop                      # Apple Silicon performance monitor    — https://github.com/tlkh/asitop
    - bat                         # File viewer with syntax highlighting — https://github.com/sharkdp/bat
    - delta                       # Readable Git diffs                   — https://github.com/dandavison/delta
    - duf                         # Disk free space viewer               — https://github.com/muesli/duf
    - dust                        # Directory size viewer                — https://github.com/bootandy/dust
    - eza                         # Enhanced file listing                — https://github.com/eza-community/eza
    - fd                          # Fast file finder                     — https://github.com/sharkdp/fd
    - ffmpeg                      #                                        https://ffmpeg.org
    - gh                          #                                        https://cli.github.com
    - git                         #                                        https://git-scm.com
    - git-lfs                     # Git storage for large files          — https://git-lfs.com
    - htop                        #                                        https://htop.dev
    - iproute2mac                 # Linux-style network commands         — https://github.com/brona/iproute2mac
    - lazygit                     # Terminal Git interface               — https://github.com/jesseduffield/lazygit
    - openconnect                 # VPN client                           — https://infradead.org/openconnect
    - ripgrep                     # Fast recursive text search           — https://github.com/BurntSushi/ripgrep
    - superfile                   # Terminal file manager                — https://superfile.dev/
    - trash-cli                   # Move files to Trash                  — https://github.com/andreafrancia/trash-cli
    - wget                        #                                        https://gnu.org/software/wget
    - yt-dlp                      # Video and audio downloader           — https://github.com/yt-dlp/yt-dlp
    - terminal-notifier           # Desktop notifications from scripts   — https://github.com/julienXX/terminal-notifier

  extras:
    - shell-plugins               # Install Zsh plugins managed by Sheldon

setup-macos:
  title: macOS settings
  description: Touch ID for sudo and Finder, Dock and keyboard preferences

  extras:
    - sudo-touch-id               # Enable Touch ID for sudo
    - macos-defaults              # Apply macOS preferences below; install only

  settings:
    touch_id:
      enabled: true
      path: /etc/pam.d/sudo_local
      template: /etc/pam.d/sudo_local.template

    defaults:
      - defaults -currentHost write com.apple.controlcenter Bluetooth -int 18
      - defaults -currentHost write com.apple.controlcenter Sound -int 18
      - defaults write com.apple.dock scroll-to-open -bool true
      - defaults write com.apple.dock showAppExposeGestureEnabled -bool true
      - defaults write com.apple.dock mru-spaces -bool false
      - defaults write com.apple.dock wvous-bl-corner -int 5
      - defaults write com.apple.dock wvous-bl-modifier -int 0
      - defaults write -g NSAutomaticPeriodSubstitutionEnabled -bool false
      - defaults write -g NSAutomaticQuoteSubstitutionEnabled -bool false
      - defaults write ru.keepcoder.Telegram AutomaticQuoteSubstitutionEnabledTGGrowingTextView -bool false
      - defaults write NSGlobalDomain ApplePressAndHoldEnabled -bool false
      - defaults write NSGlobalDomain AppleShowAllExtensions -bool true
      - defaults write com.apple.finder FXEnableExtensionChangeWarning -bool false
      - defaults write com.apple.finder AppleShowAllFiles -bool true
      - defaults write com.apple.finder ShowPathbar -bool true
      - defaults write com.apple.finder ShowStatusBar -bool true
      - defaults write com.apple.finder FXDefaultSearchScope -string SCcf
      - defaults write com.apple.finder _FXShowPosixPathInTitle -bool true
      - defaults write com.apple.finder _FXSortFoldersFirst -bool true

    restart:
      - Dock
      - Finder

setup-development:
  title: Development
  description: Neovim, tmux, direnv and Docker

  brew:
    - direnv                      # Per-directory environment variables  — https://direnv.net
    - neovim                      #                                        https://neovim.io
    - tmux                        #                                        https://github.com/tmux/tmux/wiki

  cask:
    - docker-desktop              #                                        https://docker.com

setup-codex:
  title: Codex
  description: Codex CLI, instructions and configuration

  cask:
    - codex                       #                                        https://openai.com/codex

  link:
    - source: config/codex/AGENTS.md
      destination: .codex/AGENTS.md
    - source: config/codex/keybindings.json
      destination: .codex/keybindings.json

  extras:
    - codex-sync                  # Sync shared preferences; preserve local fields

  settings:
    shared: config/codex/config.toml
    destination: ~/.codex/config.toml
    backups: ~/.local/state/dotfiles/codex/backups
    baseline: ~/.local/state/dotfiles/codex/baseline.toml

    # Each list is a TOML key path; * matches one key component.
    local_only:
      - [projects]
      - [sandbox_workspace_write, writable_roots]
      - [shell_environment_policy, set]
      - [desktop, selected-avatar-id]
      - [marketplaces]
      - [notify]
      - [model_catalog_json]
      - [model_instructions_file]
      - [cli_auth_credentials_store]
      - [mcp_servers, '*', command]
      - [mcp_servers, '*', args]
      - [mcp_servers, '*', cwd]
      - [mcp_servers, '*', env]
      - [mcp_servers, '*', http_headers]
      - [mcp_servers, '*', bearer_token]
      - [model_providers, '*', http_headers]
      - [model_providers, '*', experimental_bearer_token]
      - [desktop, worktree-repository-preferences]
      - [desktop, custom_file_handlers]
      - [desktop, migratedFollowUpQueueToSteer]
      - [tui, screen_reader_detection_done]
      - [tui, model_availability_nux]

setup-desktop:
  title: Desktop apps
  description: communication, productivity, entertainment and App Store apps

  brew:
    - mas                         # App Store command-line client        — https://github.com/mas-cli/mas

  cask:
    - arc                         #                                        https://arc.net
    - chatgpt                     #                                        https://chatgpt.com
    - iina                        # Media player                         — https://iina.io
    - notion                      #                                        https://notion.com
    - spotify                     #                                        https://spotify.com
    - readdle-spark               # Email client                         — https://sparkmailapp.com
    - steam                       #                                        https://store.steampowered.com
    - telegram                    #                                        https://telegram.org
    - zoom                        #                                        https://zoom.us
    - netron                      # Neural network model viewer          — https://netron.app
    - transmission                # BitTorrent client                    — https://transmissionbt.com
    - the-unarchiver              #                                        https://theunarchiver.com
    - bartender                   # Menu bar organizer                   — https://macbartender.com
    - karabiner-elements          # Keyboard remapping                   — https://karabiner-elements.pqrs.org
    - linearmouse                 # Mouse scrolling and acceleration     — https://linearmouse.app
    - logi-options+               # Logitech device settings             — https://logitech.com/en-us/software/logi-options-plus.html
    - raycast                     # App launcher and shortcuts           — https://raycast.com
    - vivid-app                   # Extra XDR display brightness         — https://getvivid.app

  mas:
    Keynote: 409183694
    Numbers: 409203825
    Pages: 409201541
    Amphetamine: 937984704        # Keep Mac awake
    Dropover: 1355679052          # Temporary drag-and-drop shelf
    MyWallpaper: 1552826194       # Live wallpapers
    GoodNotes: 1444383602         # Handwritten notes and PDFs

setup-vscode:
  title: VS Code
  description: application, settings, shortcuts and extensions

  cask:
    - visual-studio-code          #                                        https://code.visualstudio.com

  extras:
    - vscode-sync                 # Sync settings/extensions; export UI layout

  brew:
    - duti                        # Default file association manager     — https://github.com/moretension/duti

  settings:
    shared: config/vscode
    private: ~/.dotfiles_secret/vscode/settings.local.jsonc
    user: ~/Library/Application Support/Code/User
    extensions: ~/.vscode/extensions/extensions.json
    baseline: vscode/extensions.json
    backups: .private/backups/vscode
    cli: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
    extension_timeout_seconds: 600

    layout_keys:
      - Comments.hidden
      - menu.hiddenCommands
      - refactorPreview.hidden
      - tabs-list-width-horizontal
      - terminal.hidden
      - terminal.integrated.tabs.showDetailed
      - views.customizations
      - workbench.activity.pinnedViewlets2
      - workbench.activityBar.location
      - workbench.auxiliarybar.pinnedPanels
      - workbench.panel.alignment
      - workbench.panel.pinnedPanels
      - workbench.statusbar.hidden

    file_associations:
      - duti -s com.microsoft.VSCode public.plain-text all
      - duti -s com.microsoft.VSCode public.source-code all
      - duti -s com.microsoft.VSCode public.shell-script all
      - duti -s com.microsoft.VSCode public.json all
      - duti -s com.microsoft.VSCode public.yaml all
      - duti -s com.microsoft.VSCode net.daringfireball.markdown all

setup-iterm:
  title: iTerm
  description: application, profiles, shortcuts and fonts

  cask:
    - iterm2                      #                                        https://iterm2.com
    - font-fira-code              # Coding font with ligatures           — https://github.com/tonsky/FiraCode
    - font-fira-code-nerd-font    # Coding font with icons               — https://github.com/ryanoasis/nerd-fonts/tree/master/patched-fonts/FiraCode

  extras:
    - iterm-sync                  # Apply preferences and dynamic profiles

  settings:
    domain: com.googlecode.iterm2
    process: iTerm2
    shared: config/iterm2
    destination: ~/Library/Application Support/iTerm2/DynamicProfiles/dotfiles.json
    backups: .private/backups/iterm2
    theme_cache: iterm2/themes
    theme_library: https://raw.githubusercontent.com/mbadolato/iTerm2-Color-Schemes/b84cd1e68c9033d967fccd9febbac3072d127b7b/schemes/
    theme_timeout_seconds: 15

settings:
  sync:
    state: ~/.local/state/dotfiles
    label: com.dotfiles.sync
    agent: ~/Library/LaunchAgents/com.dotfiles.sync.plist
    interval_seconds: 14400
    run_at_load: true
