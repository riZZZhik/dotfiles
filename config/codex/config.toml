model = "gpt-6.1-sol"
model_reasoning_effort = "high"
model_verbosity = "low"
model_post_turn_compact_threshold_percent = 75
tool_output_token_limit = 4000

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[features]
chronicle = true
js_repl = false
memories = true

[memories]
generate_memories = true
use_memories = true

[mcp_servers.node_repl]
env_vars = [
  "BROWSER_USE_ACCESS_EXECUTOR_ID",
  "BROWSER_USE_ACCESS_PIPE_PATH",
  "BROWSER_USE_ACCESS_VERIFYING_IDENTITY",
]
startup_timeout_sec = 120

[mcp_servers.openaiDeveloperDocs]
startup_readiness = "catalog"
url = "https://developers.openai.com/mcp"

[plugins]
"browser@openai-bundled" = { enabled = true }
"code-review@openai-bundled" = { enabled = true }
"codex-app-tools@openai-bundled" = { enabled = true }
"computer-use@openai-bundled" = { enabled = true }
"documents@openai-primary-runtime" = { enabled = true }
"gmail@openai-curated" = { enabled = true }
"google-calendar@openai-curated" = { enabled = true }
"pdf@openai-primary-runtime" = { enabled = true }
"presentations@openai-primary-runtime" = { enabled = true }
"spreadsheets@openai-primary-runtime" = { enabled = true }
"template-creator@openai-primary-runtime" = { enabled = true }
"unified-computer-use@openai-bundled" = { enabled = true }
"visualize@openai-bundled" = { enabled = true }

[plugins."computer-history@openai-bundled"]
enabled = true

[desktop]
ambient-suggestions-enabled = true
appearanceDarkCodeThemeId = "catppuccin"
appearanceDiffMarkerStyle = "color"
appearanceLightCodeThemeId = "catppuccin"
avatar-overlay-pet-visible = false
confirm-before-close = "never"
conversationDetailMode = "STEPS_COMMANDS"
followUpQueueMode = "steer"
git-branch-prefix = ""
git-pull-request-merge-method = "squash"
reviewDelivery = "detached"
show-context-window-usage = true
worktree-upstream-refresh-mode = "best-effort"
external-agent-import-sync-enabled = true
keepRemoteControlAwakeWhilePluggedIn = true
mac-menu-bar-enabled = false
preventSleepWhileRunning = true
toys-confetti-enabled = false

[desktop.appearanceDarkChromeTheme]
accent = "#cba6f7"
contrast = 60
ink = "#cdd6f4"
opaqueWindows = false
surface = "#1e1e2e"

[desktop.appearanceLightChromeTheme]
accent = "#8839ef"
contrast = 45
ink = "#4c4f69"
opaqueWindows = false
surface = "#eff1f5"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#a6e3a1"
diffRemoved = "#f38ba8"
skill = "#cba6f7"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#40a02b"
diffRemoved = "#d20f39"
skill = "#8839ef"

[tui]
resume_cwd = "session"
session_picker_view = "comfortable"
status_line = [
  "model-with-reasoning",
  "current-dir",
  "thread-name",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
]
status_line_use_colors = true

[notice]
hide_rate_limit_model_nudge = true

